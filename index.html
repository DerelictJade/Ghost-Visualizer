<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Ghost Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="container">
        <div id="viewer">
            <div id="animationControls">
                <div id="timer">0.000s</div>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <button id="playPauseBtn">Play</button>
                    <input type="range" id="animationSlider" min="0" max="0" step="0.003333" value="0" style="flex: 1;">
                </div>
            </div>
        </div>
        <div id="sidebar">
            <h2>Settings</h2>
            <div id="settings">
                <h3>Path Offset</h3>
                <div class="slider-group">
                    <label for="offsetX">Path offset X: <span id="offsetXValue">0</span></label>
                    <input type="range" id="offsetX" min="-2000" max="2000" step="1" value="0">
                </div>

                <div class="slider-group">
                    <label for="offsetY">Path offset Y: <span id="offsetYValue">0</span></label>
                    <input type="range" id="offsetY" min="-2000" max="2000" step="1" value="0">
                </div>

                <div class="slider-group">
                    <label for="offsetZ">Path offset Z: <span id="offsetZValue">0</span></label>
                    <input type="range" id="offsetZ" min="-2000" max="2000" step="1" value="0">
                </div>
                <h3>Path Scale</h3>
                <div class="slider-group">
                    <label for="scaleX">Path Scale X: <span id="scaleXValue">1</span></label>
                    <input type="range" id="scaleX" min="0.1" max="5" step="0.1" value="1">
                </div>

                <div class="slider-group">
                    <label for="scaleY">Path Scale Y: <span id="scaleYValue">2</span></label>
                    <input type="range" id="scaleY" min="0.1" max="5" step="0.1" value="2">
                </div>

                <div class="slider-group">
                    <label for="scaleZ">Path Scale Z: <span id="scaleZValue">1</span></label>
                    <input type="range" id="scaleZ" min="0.1" max="5" step="0.1" value="1">
                </div>
                <h3>Time Scale</h3>
                <div class="slider-group">
                    <label for="timeScale">Animation Speed: <span id="timeScaleValue">1.0</span>x</label>
                    <input type="range" id="timeScale" min="0.1" max="3.0" step="0.05" value="1.0">
                </div>

                <div id="ghostList"></div>
            </div>
            <div id="dropZone">Drag & Drop File Here or Click Me</div>
            <input type="file" id="fileInput" style="display:none;" accept=".phant">
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="main.js"></script>
</body>

</html>
